name: pitwall-pipeline

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC: the morning after a race weekend
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [dev, prod]
        default: dev
      mode:
        description: "latest = new races only; meeting/season = (re)ingest one; none = reload + transform only"
        type: choice
        options: [latest, meeting, season, none]
        default: latest
      value:
        description: Meeting key (mode=meeting) or year (mode=season)
        required: false
        default: ""
  # a release (push to main) reloads, rebuilds and republishes without calling the API
  push:
    branches: [main]
    paths: ["projects/pitwall/**", "site/**"]

concurrency:
  group: pitwall-pipeline-${{ github.event_name == 'workflow_dispatch' && inputs.env || 'prod' }}
  cancel-in-progress: false # never interrupt a run halfway through a load

jobs:
  run:
    # the Monday schedule only runs once prod exists (repo variable PITWALL_SCHEDULE=on)
    if: github.event_name != 'schedule' || vars.PITWALL_SCHEDULE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.env || 'prod' }}
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.env || 'prod' }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'schedule' && 'latest' || 'none') }}
      VALUE: ${{ inputs.value }}
    defaults:
      run:
        working-directory: projects/pitwall
    steps:
      - name: Validate inputs before touching GCP
        working-directory: .
        run: |
          case "$MODE" in
            latest|none) ;;
            meeting|season)
              [[ "$VALUE" =~ ^[0-9]+$ ]] || { echo "::error::value must be a number for mode=$MODE, got '$VALUE'"; exit 1; } ;;
            *) echo "::error::unknown mode '$MODE'"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # prod only ever runs released code
          ref: ${{ env.TARGET_ENV == 'prod' && 'main' || github.ref }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PITWALL_WIF_PROVIDER }}
          service_account: ${{ vars.PITWALL_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - name: Ingest
        if: env.MODE != 'none'
        run: |
          case "$MODE" in
            latest) args="--latest" ;;
            *) args="--$MODE $VALUE" ;;
          esac
          make ingest ENV="$TARGET_ENV" ARGS="$args"
      - name: Load raw tables
        run: make load ENV="$TARGET_ENV"
      - name: Transform and test
        run: make transform ENV="$TARGET_ENV"

  site:
    needs: run
    # prod only, and only after ingest → load → transform (every dbt test included) succeeded
    if: needs.run.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.env == 'prod')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: projects/pitwall
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PITWALL_WIF_PROVIDER }}
          # read-only on marts: the site build can never change data
          service_account: ${{ vars.PITWALL_DASHBOARD_SERVICE_ACCOUNT }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Export prod data and build the lab site
        run: make site ENV=prod
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
