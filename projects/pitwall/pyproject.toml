[project]
name = "pitwall"
version = "0.1.0"
description = "Batch ELT over Formula 1 data (OpenF1 → GCS → BigQuery → dbt → Observable site) that explains race strategy — tyres, pit stops and the undercut — to people who don't follow F1."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.45.2",
    "httpx>=0.28.1",
    "pyarrow>=25.0.1",
]

[project.scripts]
pitwall = "pitwall.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]
transform = [
    "dbt-bigquery>=1.12.1",
    "dbt-core>=1.12.5",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.uv]
default-groups = ["dev", "transform"]
